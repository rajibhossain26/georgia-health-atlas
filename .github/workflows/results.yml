name: build results

# Re-runs the full analysis and commits the figures and results tables,
# so everything shown in the README is reproducible from the code.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "src/**", "sql/**", ".github/workflows/results.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_analysis.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png results/RESULTS.md results/county_indices.csv
          git diff --cached --quiet || git commit -m "Update results and figures [skip ci]"
          git push
